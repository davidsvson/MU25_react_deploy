name: Deploy react to Github pages
#
on: 
    push:
        branches: ["main"]


# rättigheter för att få skriva till gh-pages
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
    # ubuuntu
        runs-on: ubuntu-latest
        steps: # checkout
            - name: Checkout
              uses: actions/checkout@v7

        # installera node
            - name : Set up node
              uses: actions/setup-node@v7

        # installera dependencies npm install
            - name: Install dependencies
              run: npm ci

        # build - npm run build => ./dist
            - name: Build
              run: npm run build

        # ladda upp ./dist
            - name: Upload artifacts
              uses: actions/upload-pages-artifact@v5
              with:
                path: './dist'


        # ta /dist publisera på gh pages
    deploy:
        runs-on: ubuntu-latest
        needs: build # tvinga väntan på att build-jobbet är klart
        steps:
            - name: Deploy to gh pages
              uses: actions/deploy-pages@v5



    




