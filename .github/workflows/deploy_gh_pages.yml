name: Deploy react to Github pages
#
on: 
    push:
        branches: ["main"]


# rättigheter för att få skriva till gh-pages


jobs:
    build:
    # ubuuntu
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps: # checkout
            - name: Checkout
              uses: actions/checkout@v7

        # installera node
            - name : Set up node
              uses: actions/setup-node@v7

        # installera dependencies npm install
            - name: Install dependencies
              run: npm ci

        # build - npm run build => ./dist
            - name: Build
              run: npm run build

        # ladda upp ./dist
            - name: Upload artifacts
              uses: actions/upload-pages-artifact@v5
              with:
                path: './dist'


        # ta /dist publisera på gh pages
    deploy:
        environment:
            name: github-pages
            url: ${{steps.deployment.outputs.page_url}}

        runs-on: ubuntu-latest
        needs: build # tvinga väntan på att build-jobbet är klart

        permissions:
            pages: write
            id-token: write

        steps:
            - name: Deploy to gh pages
              id: deployment
              uses: actions/deploy-pages@v5



    




